default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV['DATABASE_URL'] %>

development:
  <<: *default
  database: taskmanager_development

# Never run the tests against the development database: when DATABASE_URL points
# at it (as in docker-compose), swap the database name for the test one.
test:
  <<: *default
  url: <%= ENV['DATABASE_URL']&.sub(/_development\z/, '_test') %>
  database: taskmanager_test

production:
  <<: *default
  database: taskmanager_production